name: Temporary ACTIS 0.8.8 Chat Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actis-088-chat-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download encrypted ACTIS package
        run: |
          printf '%s' '' | base64 -d > /tmp/actis-url.txt
          curl --fail --location --silent --show-error "$(cat /tmp/actis-url.txt)" --output /tmp/ACTIS-0.8.8-release.apk.enc
          test -s /tmp/ACTIS-0.8.8-release.apk.enc
          stat -c '%s bytes' /tmp/ACTIS-0.8.8-release.apk.enc
      - name: Upload encrypted package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACTIS-0.8.8-chat-encrypted
          path: /tmp/ACTIS-0.8.8-release.apk.enc
          compression-level: 0
          retention-days: 1
