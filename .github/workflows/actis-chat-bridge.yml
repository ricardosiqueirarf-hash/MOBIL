name: Temporary ACTIS Chat Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actis-chat-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download encrypted ACTIS package
        run: |
          curl --fail --location --silent --show-error \
            'https://release-assets.githubusercontent.com/github-production-release-asset/1315396385/df2d29a7-5c89-42bb-be95-e89042893bdb?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-11T14%3A17%3A23Z&rscd=attachment%3B+filename%3DACTIS-0.8.7-release.apk.enc&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-11T13%3A17%3A08Z&ske=2026-09-11T14%3A17%3A23Z&sks=b&skv=2018-11-09&sig=BY5jgivuTZIWrBXq2Mrh%2BRAoCjuTY5cTMwMdpBI3Y0A%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4OTEzNjk5NywibmJmIjoxNzg5MTMzMzk3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.oOfj1sieHIipMQsN2M7CrMtm0yo2nLHksI_A6FMvTsU&response-content-disposition=attachment%3B%20filename%3DACTIS-0.8.7-release.apk.enc&response-content-type=application%2Foctet-stream' \
            --output /tmp/ACTIS-0.8.7-release.apk.enc
          test -s /tmp/ACTIS-0.8.7-release.apk.enc
          stat -c '%s bytes' /tmp/ACTIS-0.8.7-release.apk.enc

      - name: Upload encrypted package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACTIS-0.8.7-chat-encrypted
          path: /tmp/ACTIS-0.8.7-release.apk.enc
          compression-level: 0
          retention-days: 1
